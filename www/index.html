<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>نبض</title>
<style>
  :root { --bg:#0b1020; --card:#151b33; --line:#2a3360; --text:#e8ecff; --muted:#8b93b8; --accent:#4fd1ff; --accent2:#7c5cff; --user:#243060; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(circle at 50% 0%, #1a2350 0%, var(--bg) 60%); color: var(--text);
         font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow: hidden; }
  header { position: relative; flex-shrink: 0; }
  #stage { height: 230px; position: relative; }
  #stage canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .fallback { font-size: 120px; text-align: center; line-height: 230px; }
  #status { text-align: center; color: var(--muted); font-size: 13px; height: 18px; margin-top: -6px; }
  .icon { position: absolute; top: 10px; width: 38px; height: 38px; font-size: 17px; background: var(--card); border-radius: 50%; border: 0; color: var(--text); z-index: 2; }
  #gear { right: 12px; } #mute { left: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; line-height: 1.65; font-size: 16px; white-space: pre-wrap; word-break: break-word; }
  .bot { background: var(--card); align-self: flex-start; border-bottom-right-radius: 4px; }
  .mid { background: transparent; border: 1px dashed var(--line); color: var(--muted); align-self: flex-start; font-size: 14px; }
  .me { background: var(--user); align-self: flex-end; border-bottom-left-radius: 4px; }
  .act { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 2px 6px; }
  .rem { background: #3a2a10; border: 1px solid #ffb84f; align-self: center; text-align: center; }
  .plan { align-self: stretch; background: #10162c; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.8; }
  .plan b { display: block; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
  .plan .done { color: var(--muted); text-decoration: line-through; }
  .plan .doing { color: #ffc56b; }
  form { display: flex; gap: 8px; padding: 10px 12px 14px; flex-shrink: 0; }
  input, textarea, select { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 12px 14px; font-size: 16px; outline: none; width: 100%; font-family: inherit; }
  form input { flex: 1; border-radius: 24px; min-width: 0; width: auto; }
  input:focus, select:focus { border-color: var(--accent); }
  .round { border: 0; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; cursor: pointer; background: var(--accent2); color: #fff; flex-shrink: 0; }
  #mic.on { background: #1fbf75; }
  #send.stop { background: #c2415b; }
  .sheet { position: fixed; inset: 0; background: rgba(5,8,20,.94); display: none; padding: 20px 16px 40px; overflow-y: auto; z-index: 10; }
  .sheet.open { display: block; }
  .sheet h2 { margin-bottom: 8px; font-size: 20px; }
  .sheet h3 { margin: 22px 0 6px; font-size: 16px; color: var(--accent); }
  .sheet label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { border: 0; border-radius: 14px; padding: 12px; font-size: 16px; flex: 1; background: var(--accent2); color: #fff; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: var(--line); }
  .btn.danger { background: #7a2a3a; }
  .item { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 8px 12px; margin-top: 6px; font-size: 14px; }
  .item span { flex: 1; word-break: break-word; }
  .item button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  .empty { color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.6; }
  #approve .box { max-width: 560px; margin: 8vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  #approve pre { direction: ltr; text-align: left; background: #0a0f22; border-radius: 10px; padding: 10px; max-height: 40vh; overflow: auto; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  #ap_text { white-space: pre-wrap; line-height: 1.6; margin-top: 8px; }
  #viewer pre { white-space: pre-wrap; background: var(--card); border-radius: 12px; padding: 12px; margin-top: 10px; line-height: 1.6; font-family: inherit; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<header>
  <button id="gear" class="icon" type="button" title="الإعدادات">⚙️</button>
  <button id="mute" class="icon" type="button" title="كتم الصوت">🔊</button>
  <div id="stage"></div>
  <div id="status">جاهز</div>
</header>
<div id="log"></div>
<form id="form">
  <button id="mic" class="round" type="button" title="تحدث">🎤</button>
  <input id="input" placeholder="اطلب أي مهمة..." autocomplete="off">
  <button id="send" class="round" type="submit" title="إرسال">➤</button>
</form>

<div id="settings" class="sheet">
  <h2>الإعدادات</h2>
  <label>مصدر الذكاء</label>
  <select id="s_provider">
    <option value="anthropic">Claude (مفتاح Anthropic)</option>
    <option value="openai">متوافق مع OpenAI (Ollama محلي / OpenRouter / Groq / Gemini...)</option>
  </select>
  <div id="s_base_wrap">
    <label>رابط الخادم (Base URL)</label>
    <input id="s_base" dir="ltr" placeholder="http://192.168.1.10:11434/v1">
  </div>
  <label>مفتاح API <span id="s_key_hint"></span></label>
  <input id="s_key" type="password" dir="ltr" placeholder="sk-...">
  <label>النموذج</label>
  <input id="s_model" dir="ltr">
  <label>اسم المساعد</label>
  <input id="s_name">
  <label>لون الشخصية</label>
  <input id="s_skin" type="color" style="height:48px;padding:4px">
  <label>رابط Home Assistant (اختياري)</label>
  <input id="s_ha" dir="ltr" placeholder="http://192.168.1.10:8123">
  <label>رمز Home Assistant (اختياري)</label>
  <input id="s_hatoken" type="password" dir="ltr">
  <div class="row"><button id="s_save" class="btn" type="button">حفظ</button><button id="s_close" class="btn ghost" type="button">إغلاق</button></div>

  <h3>🛠️ أدوات طوّرها لنفسه</h3><div id="l_tools"></div>
  <h3>📚 مهارات تعلّمها</h3><div id="l_skills"></div>
  <h3>📄 ملفات مساحة العمل</h3><div id="l_files"></div>
  <h3>🧠 ما يعرفه عنك</h3><div id="l_facts"></div>
  <div class="row"><button id="s_clear_chat" class="btn ghost" type="button">مسح المحادثة</button><button id="s_clear_all" class="btn danger" type="button">مسح كل شيء</button></div>
  <p class="note">المفاتيح والذاكرة محفوظة على هاتفك فقط، وتُرسل الطلبات مباشرة إلى مزوّد الذكاء الذي تختاره. الأدوات التي يطوّرها المساعد تعمل في بيئة معزولة ولا تُثبَّت إلا بموافقتك.</p>
</div>

<div id="approve" class="sheet">
  <div class="box">
    <h2 id="ap_title"></h2>
    <div id="ap_text"></div>
    <pre id="ap_code"></pre>
    <div class="row"><button id="ap_yes" class="btn" type="button">موافقة</button><button id="ap_no" class="btn ghost" type="button">رفض</button></div>
  </div>
</div>

<div id="viewer" class="sheet">
  <h2 id="v_title"></h2>
  <pre id="v_body"></pre>
  <div class="row"><button id="v_share" class="btn" type="button">مشاركة / نسخ</button><button id="v_close" class="btn ghost" type="button">إغلاق</button></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
